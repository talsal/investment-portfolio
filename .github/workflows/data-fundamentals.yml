name: Refresh fundamentals

on:
  schedule:
    - cron: '0 6 * * 0' # weekly, Sunday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Refresh fundamentals
        run: npm run data:fundamentals
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DATA_LICENSE_ACK: ${{ vars.DATA_LICENSE_ACK }}
          FUNDAMENTALS_PROVIDER: ${{ vars.FUNDAMENTALS_PROVIDER }}
          PACING_MS: ${{ vars.FUNDAMENTALS_PACING_MS }}
      - name: Validate data files
        run: npm run data:validate
      - name: Commit changes
        run: |
          git add data
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git commit -m "data: fundamentals refresh $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
