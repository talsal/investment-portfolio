name: Deploy to GitHub Pages

# Commits made by the data workflows (with GITHUB_TOKEN) do not trigger `push` workflows, so the deploy also
# listens for those workflows finishing. M5 finalises this file (custom domain, caching headers note, etc.).
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Refresh market data', 'Refresh fundamentals']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run data:validate
      - run: npm run build
        env:
          VITE_REPO_URL: https://github.com/${{ github.repository }}
          VITE_REQUEST_EMAIL: ${{ vars.REQUEST_EMAIL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
